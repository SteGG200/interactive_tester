name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  msi:
    name: Build MSI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release

      - name: Create WiX MSI Package
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -G WIX -B build/package

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: build/package/*.msi

  deb:
    name: Build DEB (Debian/Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel

      - name: Create DEB Package
        run: cpack --config build/CPackConfig.cmake -G DEB -B build/package

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/package/*.deb

  rpm:
    name: Build RPM (Fedora/RHEL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel

      - name: Create RPM Package
        run: cpack --config build/CPackConfig.cmake -G RPM -B build/package

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: build/package/*.rpm

  pkg:
    name: Build PKG (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel

      - name: Create PKG Package
        run: cpack --config build/CPackConfig.cmake -G productbuild -B build/package

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: build/package/*.pkg

  release:
    name: Publish Release
    needs: [msi, deb, rpm, pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-msi/*.msi
            artifacts/linux-deb/*.deb
            artifacts/linux-rpm/*.rpm
            artifacts/macos-pkg/*.pkg
